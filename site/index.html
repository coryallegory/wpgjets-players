<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winnipeg Jets Rookie Card Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="page">
      <h1>Winnipeg Jets Rookie Card Tracker</h1>
      <p class="subtitle">Every player who has played for, or been drafted by, a Winnipeg Jets franchise (WHA or NHL).</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search names" aria-label="Search players by name" autocomplete="off" />
        <button id="filter-gp" class="toggle" type="button" aria-pressed="true" title="On: players with at least one regular-season or playoff game for a Jets franchise. Off: Jets draft picks with no Jets games (some played for other teams).">Jets GP</button>
        <span class="controls-divider" aria-hidden="true"></span>
        <button id="filter-wha" class="toggle" type="button" aria-pressed="true">Jets WHA</button>
        <button id="filter-jets1" class="toggle" type="button" aria-pressed="true">Jets 1.0</button>
        <button id="filter-jets2" class="toggle" type="button" aria-pressed="true">Jets 2.0</button>
        <span id="count" class="count" role="status" aria-live="polite"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
